<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Painel Gestão - FSA Clean</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div class="admin-container">
    <h2>Painel de Gestão FSA Clean 🧼</h2>
    <div id="lista-orcamentos">Carregando orçamentos...</div>
  </div>

  <!-- MODAL DE EDIÇÃO/VISUALIZAÇÃO DO ORÇAMENTO -->
  <div id="modal-orcamento" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" onclick="fecharModal()">&times;</span>
      <h3>Detalhes do Orçamento <span id="modal-numero"></span></h3>

      <div id="modal-detalhes"></div>

      <div class="form-group">
        <label>Valor Total (R$)</label>
        <input type="number" id="modal-valor" step="0.01" />
      </div>

      <div class="form-group">
        <label>Observações para o PDF</label>
        <textarea id="modal-obs-pdf" rows="2" placeholder="Ex: Prazo de secagem 4 horas..."></textarea>
      </div>

      <div class="modal-actions">
        <button onclick="salvarOrcamento()" class="btn-primary">Salvar</button>
        <button onclick="gerarPDFEWhatsApp()" class="btn-success">Gerar PDF (1 clique)</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
