<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FSA Clean - Solicite seu Orçamento</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>FSA Clean 🧼</h1>
      <p>Higienização e Sanitização Profissional de Estofados</p>
    </header>

    <form id="form-orcamento" class="form-card">
      <h2>Solicitar Orçamento</h2>

      <div class="form-group">
        <label for="nome">Nome Completo *</label>
        <input type="text" id="nome" required placeholder="Seu nome" />
      </div>

      <div class="form-group">
        <label for="telefone">WhatsApp / Telefone *</label>
        <input type="tel" id="telefone" required placeholder="(75) 99999-9999" />
      </div>

      <div class="form-group">
        <label for="bairro">Bairro *</label>
        <input type="text" id="bairro" required placeholder="Seu bairro" />
      </div>

      <div class="form-group">
        <label for="tipo_estofado">Tipo de Estofado *</label>
        <select id="tipo_estofado" required>
          <option value="">Selecione...</option>
          <option value="Sofá">Sofá</option>
          <option value="Colchão">Colchão</option>
          <option value="Cadeiras">Cadeiras</option>
          <option value="Automotivo">Automotivo</option>
          <option value="Outro">Outro</option>
        </select>
      </div>

      <div class="form-group">
        <label for="ultima_limpeza">Há quanto tempo o estofado não é limpo?</label>
        <input type="text" id="ultima_limpeza" placeholder="Ex: Nunca limpo, Há 6 meses, Mais de 1 ano..." />
      </div>

      <!-- SEPARAÇÃO DE PETS E MANCHAS -->
      <div class="form-row-two">
        <div class="form-group">
          <label>Possui Pets em casa?</label>
          <div class="radio-group">
            <label><input type="radio" name="tem_pets" value="true"> Sim</label>
            <label><input type="radio" name="tem_pets" value="false" checked> Não</label>
          </div>
        </div>

        <div class="form-group">
          <label>Possui Manchas visíveis?</label>
          <div class="radio-group">
            <label><input type="radio" name="tem_manchas" value="true"> Sim</label>
            <label><input type="radio" name="tem_manchas" value="false" checked> Não</label>
          </div>
        </div>
      </div>

      <!-- FOTO OBRIGATÓRIA -->
      <div class="form-group">
        <label for="fotos">Fotos do Estofado (Pelo menos 1 foto é OBRIGATÓRIA - até 20 fotos) *</label>
        <input type="file" id="fotos" multiple accept="image/*" required />
        <small class="help-text">Envie fotos de frente e de partes com sujeiras/manchas.</small>
      </div>

      <div class="form-group">
        <label for="observacao">Observações Adicionais</label>
        <textarea id="observacao" rows="3" placeholder="Detalhes como tecido, modelo, etc."></textarea>
      </div>

      <button type="submit" id="btn-enviar" class="btn-primary">Enviar Solicitação de Orçamento</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
